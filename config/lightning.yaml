wandb_params:
  entity: sjtu-lx-lab
  project_name: forest-navigation
  run_name: train

data_params:
  tranform:
    resize:
      w_h: [128, 96]    # width, height, origin img is (640, 480)
    norm:
      mean: [0.485, 0.456, 0.406, 0.3]
      std: [0.229, 0.224, 0.225, 0.2]
  h5_file_path: /media/iunone/datasets/forest_nav/all_scenarios_converted.h5
  time_horizon: 5

model_params:
  len_traj_pred: 32   # it should be 2^n
  vision_encoder:
    embedding_dim: 256
    time_horzion: 5
  noise_pred_net:
    down_dims: [64, 128, 256]
    cond_predict_scale: False
    num_diffusion_iters: 10
  traj_norm_x: [0, 10]
  traj_norm_y: [-5, 5]

train_params:
  seed: 42
  batch_size: 32
  num_workers: 16
  max_epochs: 1000
  grad_clip_max_norm: 5.  # if 0, no clip
  optimizer:
    optimizer: adam # [ adam, adamw, sgd ], defalut: adam with betas: (0.9, 0.98); sgd with momentum: 0.9
    lr: 5e-4
    weight_decay: 0.0
    scheduler:
      type: cosine # [ cyclic, plateau, cosine]
      # cyclic
      cyclic_period: 10
      # plateau
      plateau_patience: 3
      plateau_factor: 0.5
      # warm up
      warmup: False
      warmup_epochs: 4