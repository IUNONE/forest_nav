wandb_params:
  entity: sjtu-lx-lab
  project_name: forest-navigation
  run_name: train

data_params:
  transform:
    resize:
      w_h: [224, 224]
    norm:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  h5_file_path: /data/zhangshenghong/datasets/forest_nav_rgb_trajectory.h5
  use_validation: false

model_params:
  len_traj_pred: 32   # it should be 2^n
  vision_encoder:
    obs_encoder: resnet50
    pretrained: true
    replace_batch_norm: false
    embedding_dim: 512
    input_channels: 3
    spatial_pool_size: 4
    spatial_channels: 128
    dropout: 0.1
  noise_pred_net:
    down_dims: [128, 256, 512]
    diffusion_step_embed_dim: 512
    kernel_size: 3
    n_groups: 8
    cond_predict_scale: true
    num_train_timesteps: 100
    num_inference_steps: 10
  # Measured valid-label range: x [-0.67, 4.57], y [-0.95, 2.11] metres.
  # Keep margins while ensuring every target remains inside diffusion [-1, 1].
  traj_norm_x: [-1.0, 6.5]
  traj_norm_y: [-3.0, 3.0]

train_params:
  seed: 42
  accelerator: auto
  devices: 2
  strategy: ddp_find_unused_parameters_false
  precision: 32
  deterministic: false
  checkpoint_dir: results/resnet50_spatial
  batch_size: 256
  num_workers: 16
  max_epochs: 1000
  grad_clip_max_norm: 5.  # if 0, no clip
  optimizer:
    optimizer: adamw # [adam, adamw, sgd]
    lr: 3e-4
    backbone_lr: 1e-4
    weight_decay: 1e-4
    scheduler:
      type: cosine # [ cyclic, plateau, cosine]
      # cyclic
      cyclic_period: 10
      # plateau
      plateau_patience: 3
      plateau_factor: 0.5
      # warm up
      warmup: False
      warmup_epochs: 4
